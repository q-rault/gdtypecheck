# Keep the file name release.yml: crates.io trusted publishing is set up for it.
name: Publish release

on:
  push:
    tags:
      - 'v[0-9]*'
  # Cut release (cut-release.yml) starts it this way, on the tag it pushed: a
  # tag pushed with the default token does not trigger `push`.
  workflow_dispatch:

permissions:
  contents: write

# No binary archives: gdsuite builds gdtypecheck in from crates.io, and anyone
# else installs it with `cargo install`.
jobs:
  publish:
    name: Publish to crates.io
    # Run by hand, it must be on a release tag, not a branch.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      # The runner's own Rust: publishing only checks that the crate builds.
      - name: Check the tag matches the crate version
        shell: bash
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "gdtypecheck") | .version')
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match gdtypecheck version ${VERSION} in Cargo.toml"
            exit 1
          fi

      # Run again after a failure, Publish release skips what crates.io
      # already has, so it can still finish the GitHub release.
      - name: Find the crates left to publish
        id: left
        shell: bash
        run: |
          left=""
          for crate in gdtypecheck; do
            version=$(cargo metadata --no-deps --format-version 1 --locked | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version')
            if curl -fsS "https://index.crates.io/${crate:0:2}/${crate:2:2}/${crate}" 2>/dev/null | grep -q "\"vers\":\"${version}\""; then
              echo "${crate} ${version} is already on crates.io"
            else
              left="${left} -p ${crate}"
            fi
          done
          echo "args=${left}" >> "$GITHUB_OUTPUT"

      - name: Get a crates.io token
        if: steps.left.outputs.args != ''
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish
        if: steps.left.outputs.args != ''
        run: cargo publish --locked ${{ steps.left.outputs.args }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # v1.0.0-rc.1 and the like are prereleases: never marked "Latest".
          prerelease: ${{ contains(github.ref_name, '-') }}

  notify-gdsuite:
    name: Ask gdsuite to pin this release
    # gdsuite builds the tools from crates.io: it needs only the published crate.
    needs: publish
    # gdsuite pins stable releases only.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest

    steps:
      # Starts gdsuite's pin-tools workflow, which opens or updates its pin PR.
      # GDSUITE_TRIGGER_TOKEN can only start workflows in gdsuite (see gdsuite's
      # RELEASING.md).
      - name: Start gdsuite's pin-tools workflow
        env:
          GH_TOKEN: ${{ secrets.GDSUITE_TRIGGER_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::GDSUITE_TRIGGER_TOKEN is not set: run pin-tools in gdsuite by hand"
            exit 0
          fi
          gh workflow run pin-tools.yml -R q-rault/gdsuite \
            -f release="${{ github.event.repository.name }} ${GITHUB_REF_NAME}"
