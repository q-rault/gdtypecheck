[package]
name = "gdtypecheck"
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
authors = ["Quentin Rault"]
description = "Report GDScript compile errors and broken resource references in a Godot project, without running it"
license = "MIT OR Apache-2.0"
repository = "https://github.com/q-rault/gdtypecheck"
homepage = "https://github.com/q-rault/gdtypecheck"
readme = "README.md"
keywords = ["godot", "gdscript", "cli", "typecheck"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
which = "8.0"

[dev-dependencies]
tempfile = "3.12"
